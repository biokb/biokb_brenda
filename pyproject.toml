[project]
name = "biokb-brenda"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Christian Ebeling", email = "Christian.Ebeling@scai.fraunhofer.de" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "cryptography>=46.0.3",
    "neo4j>=6.0.3",
    "pandas>=2.3.3",
    "pymysql>=1.1.2",
    "rdflib>=7.4.0",
    "rdflib-neo4j>=1.1",
    "rdkit>=2025.9.1",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.44",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "podman-compose>=1.5.0",
]
docs = [
    "eralchemy[graphviz]>=1.6.0",
]
tests = [
    "pytest>=9.0.1",
]
[project.scripts]
biokb_brenda = "biokb_brenda.cli:main"
